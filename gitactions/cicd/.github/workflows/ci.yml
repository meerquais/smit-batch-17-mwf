name: React CI

on:
    push:
        branches:
            - main

jobs:
    build:

        runs-on: ubuntu-latest

        steps:

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: 22


            - name: Install Dependencies
              run: npm install

            - name: Build React App
              run: npm run build