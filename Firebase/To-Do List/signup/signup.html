<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
   
</head>
<body>
    <h2>Create Account</h2>

    <input type="text" id="fullname" placeholder="Type Fullname">
    <input type="email" id="email" placeholder="Type email">
    <input type="text" id="location" placeholder="Type location">
    <input type="password" id="password" placeholder="Type password">

    <button id="signupBtn">Signup</button>
    <button id="googleBtn">Signup with Google</button>
    
</body>

<script type="module" src="./signup.js"></script>

</html>
