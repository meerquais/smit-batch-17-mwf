<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local and Session Storage!</title>
</head>
<body>
    <h1>Hello World!</h1>

    <h2>Sign Up!</h2>

    <form id="signupForm">

        <label for="">User Name: </label>
        <input type="text" name="" id="username" required> <br><br>
        <label for="">Password: </label>
        <input type="password" name="" id="password"> <br><br>

        <button type="submit">Sign Up</button>
    </form>

    <p id="msg"></p>

    <br />
    <br />
    <br />
    <br />

    <h2>Login</h2>


    <form  id="loginForm">
       <label for="">User Name: </label>
        <input type="text" name="" id="loginUsername" required> <br><br>
        <label for="">Password: </label>
        <input type="password" name="" id="loginPassword"> <br><br>

        <button type="submit">Login</button>
    </form>

    <p id="loginMsg"></p>
    <p id="loggedMsg"></p>

    
</body>
