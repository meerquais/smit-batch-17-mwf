<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar starts from here -->

    <div>
        <nav class="navbar">
            <div class="nav-logo">
                <img src="./assets/logo.svg" alt="">
            </div>
            <div class="nav-list">
                <ul>
                    <li>Store</li>
                    <li>Mac</li>
                    <li>iPad</li>
                    <li>iPhone</li>
                    <li>Watch</li>
                    <li>Vision</li>
                    <li>AirPods</li>
                    <li>Tv & Home</li>
                    <li>Entertainment</li>
                    <li>Accessories</li>
                    <li>Support</li>
                </ul>
            </div>
            <div class="nav-icons">
                <img src="./assets/search.svg" alt="">
                <img src="./assets/cart.svg" alt="">
            </div>
        </nav>
    </div>
    <!-- Navbar ends here  -->

    <!-- section 1 starts from here  -->

    <section class="hero1">
        <div class="hero1img">
            <img src="./assets/hero1img.png" alt="">
        </div>
        <div class="hero1btn">
            <button>Shop</button>
        </div>
    </section>

    <!-- section 1 end here  -->

    <!-- section 2 starts here  -->

    <section class="hero2">
        <div class="hero2Content">
            <br/>
            <br/>
            <br/>
            <br/>
            <h1>College Students</h1>
            <p>Mac and iPad</p>
            <p>Major. In any field</p>
            <button>Learn More</button>
        </div>
    </section>

    <!-- section 2 ends here  -->

    <!-- section 3 starts here  -->

    <section class="hero3">
        <div class="hero3container1">
            <div>
                <img src="./assets/air.png" alt="">
            </div>
            <p>Now supercharged by the M3 chip.</p>
            <div>
                <button>Learn more</button>
                <button>Buy</button>
            </div>
        </div>
        <div class="hero3container2">
            <h1>Side 2</h1>

        </div>
    </section>

    <!-- section 3 ends here  -->
    
</body>
</html>
